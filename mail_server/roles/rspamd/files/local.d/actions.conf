# Managed by Ansible (librenfra mail_server, role rspamd).
# Above 6 a message gets "X-Spam: Yes" and lands in Junk (roles/dovecot);
# above 15 it is refused, and the sender gets a bounce.
#
# No greylisting: mail arrives through Cloudflare's Email Worker, which
# cannot try again later - a temporary refusal would only send the message
# to the fallback address.
reject = 15;
add_header = 6;
greylist = null;
