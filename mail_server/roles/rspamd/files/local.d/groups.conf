# Managed by Ansible (librenfra mail_server, role rspamd).
# R_MIXED_CHARSET weighs 5.0 by default and fires on ordinary Turkish text -
# "Teşekkürler, Şükrü Işık" scored 3.75 on its own when this was tested
# (2026-10-23). Lowered so Turkish mail does not drift into Junk.
group "headers" {
  symbols {
    "R_MIXED_CHARSET" {
      weight = 1.0;
    }
  }
}
