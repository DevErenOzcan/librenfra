# --- Data volume ---------------------------------------------------------------
# VM 9130's 40 GB disk (terraform/main.tf), mounted at /mnt/data. The
# mailboxes live on it, with rspamd's and Redis's state (what the spam
# filter has learnt). The services that use a directory are stopped while it
# is moved onto the volume.
data_volume_label: mail-data
data_volume_binds:
  - name: vmail
    path: /var/vmail
    stop: [dovecot.service, postfix.service]
  - name: rspamd
    path: /var/lib/rspamd
    stop: [rspamd.service]
  - name: redis
    path: /var/lib/redis
    stop: [rspamd.service, redis-server.service]
