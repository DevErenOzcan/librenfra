---
# =============================================================================
# mail (VM 130) - the mail server of deverenozcan.com, 10.10.20.10 in the DMZ
# =============================================================================
# An Ubuntu Server 26.04 cloud image: cloud-init has set its address, its
# hostname and FQDN (mail.deverenozcan.com) and the controller's SSH key for
# the "ubuntu" user (terraform/main.tf). Everything changed on top of that is
# here; the roles' defaults/main.yml say what each value does.

# --- This server -----------------------------------------------------------------
mail_hostname: mail
mail_domain: deverenozcan.com
mail_fqdn: "{{ mail_hostname }}.{{ mail_domain }}"
mail_address: 10.10.20.10

# Who gets what the RFCs require a domain to accept - postmaster@, abuse@ -
# and the server's own mail to root. An address of a mailbox here.
mail_admin_address: eren.ozcan@deverenozcan.com

# --- Secrets ---------------------------------------------------------------------
# From .env next to site.yml (git-ignored; .env.example shows the format),
# read here so nothing has to be exported before a run. Empty when unset.
mail_secrets_file: "{{ playbook_dir }}/.env"
mail_ldap_password: >-
  {{ lookup('ansible.builtin.ini', 'MAIL_LDAP_PASSWORD', type='properties',
            file=mail_secrets_file, interpolation=false, default='')
     if mail_secrets_file is file else '' }}
mail_receiver_secret: >-
  {{ lookup('ansible.builtin.ini', 'MAIL_RECEIVER_SECRET', type='properties',
            file=mail_secrets_file, interpolation=false, default='')
     if mail_secrets_file is file else '' }}
mail_cloudflared_token: >-
  {{ lookup('ansible.builtin.ini', 'MAIL_CLOUDFLARED_TOKEN', type='properties',
            file=mail_secrets_file, interpolation=false, default='')
     if mail_secrets_file is file else '' }}

# --- The directory -------------------------------------------------------------
# Mailboxes are the Active Directory users (../samba_ad) whose "mail"
# attribute is set and who are in the group "Mail Users"; they sign in with
# that address and their AD password. The mail server looks them up as
# svc-mail, over LDAPS - the one connection the firewall lets the DMZ make
# into the LAN (DMZ rule 25).
mail_ad_server: dc1.ad.deverenozcan.com
mail_ad_address: 10.10.10.10
mail_ad_base: DC=ad,DC=deverenozcan,DC=com
mail_ad_bind_user: svc-mail@ad.deverenozcan.com
mail_ad_group_dn: CN=Mail Users,CN=Users,DC=ad,DC=deverenozcan,DC=com

