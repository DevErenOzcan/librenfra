---
- name: samba_ad_dc | Restart samba-ad-dc
  ansible.builtin.systemd_service:
    name: samba-ad-dc
    state: restarted
    daemon_reload: true

- name: samba_ad_dc | Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted

# A oneshot: running it again clears the failure the old wait left behind.
- name: samba_ad_dc | Wait for the network again
  ansible.builtin.systemd_service:
    name: systemd-networkd-wait-online
    state: restarted
    daemon_reload: true
