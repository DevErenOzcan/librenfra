---
# cloudflared: dials out to Cloudflare and keeps the tunnel the admin page
# is reached through from the internet. No port is opened anywhere; the LAN
# may reach the internet (firewall rule LAN 50). Updated by apt, not by itself.

- name: cloudflared | Cloudflare's signing key
  ansible.builtin.get_url:
    url: "{{ cloudflared_key_url }}"
    dest: "{{ cloudflared_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: cloudflared | Cloudflare's repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/cloudflared.list
    content: "{{ cloudflared_repo }}\n"
    owner: root
    group: root
    mode: "0644"
  register: cloudflared_repo_file

- name: cloudflared | The package
  ansible.builtin.apt:
    name: cloudflared
    state: present
    update_cache: "{{ cloudflared_repo_file is changed }}"
  # A dry run never wrote the repository, so the package cannot be found.
  when: not (ansible_check_mode and cloudflared_repo_file is changed)

- name: cloudflared | The service
  ansible.builtin.template:
    src: cloudflared-tunnel.service.j2
    dest: /etc/systemd/system/cloudflared-tunnel.service
    owner: root
    group: root
    mode: "0644"
  notify: cloudflared | Restart the tunnel

- name: cloudflared | No tunnel yet
  ansible.builtin.debug:
    msg: >-
      SAMBA_CLOUDFLARED_TOKEN is empty, so cloudflared is installed but not
      running. It starts once the tunnel exists and its token is in .env
      (README.md, "The admin page").
  when: samba_ad_cloudflared_token | length == 0

- name: cloudflared | Directory for the token
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: cloudflared | The tunnel's token
  ansible.builtin.copy:
    dest: /etc/cloudflared/tunnel-token
    content: "{{ samba_ad_cloudflared_token }}\n"
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true
  notify: cloudflared | Restart the tunnel
  when: samba_ad_cloudflared_token | length > 0

- name: cloudflared | The tunnel runs and starts at boot
  ansible.builtin.systemd_service:
    name: cloudflared-tunnel
    state: started
    enabled: true
    daemon_reload: true
  when: samba_ad_cloudflared_token | length > 0
