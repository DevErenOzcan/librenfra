---
# Values live in host_vars/dc1.yml; these are the defaults.

# Groups other machines here rely on. Created when missing; their members
# are managed by hand (README.md, "Using it").
#   - name: Mail Users
#     description: "..."
samba_ad_groups: []

# Accounts other machines sign in with to read the directory. Created when
# missing, with a password that never expires, taken from .env under
# password_key. Existing accounts are left alone - their password too.
#   - name: svc-mail
#     description: "..."
#     password_key: SAMBA_SVC_MAIL_PASSWORD
samba_ad_service_accounts: []

samba_ad_secrets_file: "{{ playbook_dir }}/.env"

# The domain's password policy, as samba-tool domain passwordsettings set
# options without the dashes in front: { option: value }. Only what is listed
# is changed.
samba_ad_password_settings: {}
# Which line of "samba-tool domain passwordsettings show" each option is read
# back from.
samba_ad_password_settings_labels:
  account-lockout-threshold: "Account lockout threshold (attempts)"
  account-lockout-duration: "Account lockout duration (mins)"
  reset-account-lockout-after: "Reset account lockout after (mins)"
  max-pwd-age: "Maximum password age (days)"
  min-pwd-age: "Minimum password age (days)"
  min-pwd-length: "Minimum password length"
  history-length: "Password history length"
